<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b0807">
<title>Jaguar Cocina</title>
<style>
:root{--bg:#0b0807;--bg2:#120d0b;--p:#17110f;--p2:#201815;--p3:#2a201b;--t:#f7efe8;--m:#a8978a;--m2:#7a6b61;--o:#ff6b1f;--o2:#ff9a3d;--g:#35d07f;--r:#ff5c5c;--y:#ffc233;--b:#5aa9ff;--l:#2d221c;--l2:#3d2e26;--gl:linear-gradient(135deg,#ff6b1f,#ff9a3d)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a140a55,transparent 60%),var(--bg);color:var(--t);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--l);border-radius:14px;padding:10px 14px;min-height:48px;cursor:pointer;font-weight:600;transition:transform .12s,background .15s,border-color .15s}
button:hover{border-color:var(--l2);background:var(--p3)}button:active{transform:scale(.97)}button:disabled{opacity:.4;pointer-events:none}
button.pri{background:var(--gl);color:#1b0c03;font-weight:700;border:0}button.ok{background:linear-gradient(135deg,#2bc473,#47e096);color:#04210f;font-weight:700;border:0}button.ghost{background:transparent}
select{width:100%;background:var(--bg2);border:1px solid var(--l);border-radius:10px;padding:8px 10px;min-height:42px;color:var(--t);font:inherit}
input{width:100%;background:var(--bg2);border:1px solid var(--l);border-radius:12px;padding:11px 14px;min-height:46px}input:focus{border-color:var(--o);outline:0;box-shadow:0 0 0 3px #ff6b1f22}
label{display:block;color:var(--m);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}
.err{color:var(--r);min-height:22px;margin:8px 0;font-size:14px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;background:var(--gl);display:grid;place-items:center}.logo svg{width:20px;height:20px;fill:#1b0c03}
.brand b{font-size:16px}.brand small{display:block;color:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.auth{min-height:100%;display:grid;place-items:center;padding:20px}
.c{width:100%;max-width:400px;background:linear-gradient(180deg,var(--p),var(--bg2));border:1px solid var(--l);border-radius:24px;padding:28px}.c h2{margin:18px 0 4px;font-size:22px}.c .sub{color:var(--m);margin:0}
.app{display:flex;flex-direction:column;height:100%}
.top{display:flex;gap:10px;padding:12px 18px;align-items:center;border-bottom:1px solid var(--l);background:#0e0a09cc;backdrop-filter:blur(10px)}.top .sp{flex:1}
.top button{min-height:40px;padding:6px 14px;border-radius:12px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--p);border:1px solid var(--l);font-size:12.5px;color:var(--m);font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--m2)}.pill.live i{background:var(--g);box-shadow:0 0 0 3px #35d07f33}.pill.off i{background:var(--r)}
.tabs{display:flex;gap:4px;background:var(--bg);border:1px solid var(--l);border-radius:14px;padding:4px}.tabs button{min-height:36px;border:0;background:transparent;border-radius:10px;font-size:14px;color:var(--m)}.tabs .on{background:var(--p3);color:var(--t);box-shadow:inset 0 0 0 1px var(--l2)}
.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 18px 18px}
.col{display:flex;flex-direction:column;min-height:0;background:#0f0a09;border:1px solid var(--l);border-radius:20px}
.col h3{margin:0;padding:14px 16px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;color:var(--m)}
.col h3 span{background:var(--p2);border:1px solid var(--l);border-radius:999px;padding:2px 10px;color:var(--t);font-size:12px}
.col .list{flex:1;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.col.pend h3{color:var(--y)}.col.prep h3{color:var(--b)}.col.lis h3{color:var(--g)}
.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:16px;padding:14px;position:relative;overflow:hidden;animation:up .25s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--st,var(--m2))}
.card.nuevo{box-shadow:0 0 0 2px var(--o),0 0 28px -4px #ff6b1f88}
.card .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}.card .n{font-size:24px;font-weight:800;letter-spacing:-.02em}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--p3);color:var(--m)}
.tag.dom{background:#5aa9ff22;color:var(--b)}.tag.web{background:#ff6b1f22;color:var(--o2)}
.card .tm{margin-left:auto;text-align:right;font-size:12px;color:var(--m)}.card .el{display:block;font-size:20px;font-weight:800;color:var(--g)}.card .el.w{color:var(--y)}.card .el.d{color:var(--r)}
.card ul{list-style:none;margin:6px 0 10px;padding:0}.card li{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--l);font-size:16px}.card li b{color:var(--o2);min-width:30px}
.card li small{color:var(--m);display:block;font-size:13px}.card .nota{background:#ffc23318;border:1px solid #ffc23344;color:var(--y);border-radius:10px;padding:8px 10px;font-size:14px;margin:6px 0}
.card .meta{color:var(--m);font-size:13px;margin:4px 0}.card .meta b{color:var(--t)}
.card button{width:100%;min-height:52px;font-size:16px}
.vacio{text-align:center;color:var(--m2);padding:30px 10px;font-size:14px}
.deliv{flex:1;overflow:auto;padding:14px 18px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-content:start}
.err-bar{background:#ff5c5c22;color:var(--r);padding:8px 18px;font-size:14px;display:none}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@media(max-width:900px){.board{grid-template-columns:1fr;overflow:auto;display:flex;flex-direction:column}.col{flex:none;max-height:none}.col .list{overflow:visible}.brand small{display:none}.top{padding:10px 12px}}
</style></head><body>
<div id="app"></div>
<script>
const SUPA={url:"https://akaecdfbpsqhqkgafjta.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYWVjZGZicHNxaHFrZ2FmanRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMzQyMTIsImV4cCI6MjEwNzYxMDIxMn0.gTohBD9OgC3rji_MX6lftWetvjuVQ6zCizbR1p_c5Oc"};
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOGO='<span class="logo"><svg viewBox="0 0 24 24"><path d="M4 3l4 3h8l4-3 1 7c0 6-3.5 11-9 11S3 16 3 10l1-7zm5 9a1.3 1.3 0 100 2.6A1.3 1.3 0 009 12zm6 0a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zm-4.2 4l1.2 1.2 1.2-1.2z"/></svg></span>';
let canDeliver=false,ses=null,roles=[],admin=false,view="cocina",orders=[],known=null,fresh=new Set(),sound=true,ws=null,wsOk=false,hb=null,poll=null,tickT=null,reconnT=null,busy=false,repartidores=[];
try{ses=JSON.parse(sessionStorage.getItem("kds-ses")||"null")}catch(_){}
async function api(path,opt,tok){
  let r;try{r=await fetch(SUPA.url+path,Object.assign({},opt,{headers:Object.assign({apikey:SUPA.key,Authorization:"Bearer "+(tok||SUPA.key),"Content-Type":"application/json"},(opt||{}).headers)}))}
  catch(_){throw new Error("No se pudo conectar. Revisa tu internet.")}
  let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description))||"Error "+r.status);return j}
function setSes(j,email){ses=j?{at:j.access_token,rt:j.refresh_token,exp:Date.now()/1000+(j.expires_in||3600),email:email||(ses&&ses.email)}:null;try{sessionStorage.setItem("kds-ses",JSON.stringify(ses))}catch(_){}}
async function token(){if(!ses)return null;if(ses.exp-Date.now()/1000>60)return ses.at;
  try{setSes(await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:ses.rt})}));if(ws&&wsOk)wsSend("access_token",{access_token:ses.at});return ses.at}catch(_){setSes(null);return null}}
const rpc=async(n,a)=>api("/rest/v1/rpc/"+n,{method:"POST",body:JSON.stringify(a||{})},await token());
const get=async p=>api("/rest/v1/"+p,{},await token());
/* ---------- login ---------- */
function login(msg){stop();$("#app").innerHTML=`<div class="auth"><div class="c"><div class="brand">${LOGO}<div><b>Jaguar Cocina</b><small>Burger &amp; Grill</small></div></div><h2>Pantalla de cocina</h2><p class="sub">Inicia sesión (cocina, repartidor o administrador).</p><label>Correo</label><input id="em" type="email" autocomplete="username"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="er">${esc(msg||"")}</div><button class="pri" style="width:100%" id="go">Entrar</button></div></div>`;
  const go=async()=>{try{const e=$("#em").value.trim();setSes(await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:e,password:$("#pw").value})}),e);start()}catch(x){$("#er").textContent=/invalid/i.test(x.message)?"Correo o contraseña incorrectos.":x.message}};
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()}}
async function salir(m){try{if(ses)await api("/auth/v1/logout",{method:"POST"},ses.at)}catch(_){}setSes(null);orders=[];known=null;login(m)}
function stop(){clearInterval(hb);clearInterval(poll);clearInterval(tickT);clearTimeout(reconnT);if(ws){ws.onclose=null;try{ws.close()}catch(_){}}ws=null;wsOk=false}
async function start(){
  if(!ses)return login();
  $("#app").innerHTML='<div class="auth"><div class="c" style="text-align:center"><b>Cargando…</b></div></div>';
  try{admin=(await get("admin_users?select=user_id")).length>0;roles=(await get("user_roles?select=role")).map(x=>x.role);
    const k=admin||roles.includes("cajero")||roles.includes("cocina"),d=admin||roles.includes("cajero")||roles.includes("repartidor");
    if(!k&&!d){await salir("Esta cuenta no tiene permiso de cocina ni de reparto.");return}
    canDeliver=admin||roles.includes("cajero");view=k?"cocina":"reparto";
    if(canDeliver){try{repartidores=await rpc("repartidores_lista")||[]}catch(_){repartidores=[]}}
    shell(k,d);await refresh();conectar();
    poll=setInterval(refresh,15000);tickT=setInterval(tick,1000)}catch(x){await salir(x.message)}}
/* ---------- tiempo real (Realtime, protocolo Phoenix) ---------- */
function wsSend(ev,payload,topic){if(ws&&ws.readyState===1)ws.send(JSON.stringify({topic:topic||"realtime:kds",event:ev,payload,ref:String(Date.now()%1e9),join_ref:"1"}))}
async function conectar(){
  clearTimeout(reconnT);if(!ses)return;const t=await token();if(!t)return;
  try{ws=new WebSocket(SUPA.url.replace("https","wss")+"/realtime/v1/websocket?apikey="+SUPA.key+"&vsn=1.0.0")}catch(_){return reintentar()}
  ws.onopen=()=>{wsSend("phx_join",{config:{broadcast:{self:false},presence:{key:""},postgres_changes:[{event:"*",schema:"public",table:"orders"}]},access_token:t});
    clearInterval(hb);hb=setInterval(()=>wsSend("heartbeat",{},"phoenix"),25000)};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}
    if(m.event==="phx_reply"&&m.topic==="realtime:kds"){wsOk=m.payload&&m.payload.status==="ok";estado()}
    else if(m.event==="postgres_changes")refresh()};
  ws.onclose=()=>{wsOk=false;estado();reintentar()};ws.onerror=()=>{wsOk=false;estado()}}
function reintentar(){clearTimeout(reconnT);reconnT=setTimeout(()=>{if(ses)conectar()},4000)}
function estado(){const p=$("#live");if(!p)return;p.className="pill "+(wsOk?"live":"off");p.lastChild.textContent=wsOk?"En vivo":"Sin conexión en vivo (actualiza cada 15 s)"}
/* ---------- datos ---------- */
async function refresh(){
  if(busy)return;
  try{const d=await rpc("kds_pedidos");
    if(known){d.forEach(o=>{if(!known.has(o.id)&&(o.estado==="pendiente"||o.estado==="confirmado")){fresh.add(o.id);beep();setTimeout(()=>{fresh.delete(o.id);draw()},20000)}})}
    known=new Set(d.map(o=>o.id));orders=d;const b=$("#eb");if(b)b.style.display="none";draw()}
  catch(x){const b=$("#eb");if(b){b.textContent=x.message;b.style.display="block"}if(/jwt|expired|permiso/i.test(x.message)&&!ses)login(x.message)}}
async function mover(id,estado){busy=true;try{await rpc("kds_set_status",{p_order:id,p_estado:estado})}catch(x){alert(x.message)}busy=false;refresh()}
function beep(){if(!sound)return;try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type="sine";o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.001,a.currentTime);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start();o.stop(a.currentTime+.65);setTimeout(()=>a.close(),900)}catch(_){}}
/* ---------- pantalla ---------- */
function shell(k,d){
  $("#app").innerHTML=`<div class="app"><div class="top"><div class="brand">${LOGO}<div><b>Jaguar Cocina</b><small>Burger &amp; Grill</small></div></div>
  ${k&&d?'<div class="tabs" id="tabs"><button data-v="cocina">Cocina</button><button data-v="reparto">Domicilios</button></div>':""}<span class="sp"></span>
  <span class="pill off" id="live"><i></i><span>Conectando…</span></span><span class="pill" id="clk"></span><button id="snd">🔔</button><a href="admin.html" style="text-decoration:none"><button type="button" class="ghost">Menú</button></a><button class="ghost" id="bsal">Salir</button></div><div class="err-bar" id="eb"></div><div id="v" style="flex:1;min-height:0;display:flex;flex-direction:column"></div></div>`;
  $("#bsal").onclick=()=>salir();$("#snd").onclick=()=>{sound=!sound;$("#snd").textContent=sound?"🔔":"🔕";if(sound)beep()};
  if($("#tabs"))$("#tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(b){view=b.dataset.v;draw()}};tick()}
const hora=t=>new Date(t).toLocaleTimeString("es-CO",{timeZone:"America/Bogota",hour:"2-digit",minute:"2-digit"});
function mins(t){return Math.max(0,Math.floor((Date.now()-new Date(t).getTime())/1000))}
function fmt(s){const m=Math.floor(s/60);return m+":"+String(s%60).padStart(2,"0")}
function tick(){const c=$("#clk");if(c)c.textContent=new Date().toLocaleTimeString("es-CO",{timeZone:"America/Bogota",hour:"2-digit",minute:"2-digit"});
  document.querySelectorAll("[data-t]").forEach(e=>{const s=mins(e.dataset.t);e.textContent=fmt(s);e.className="el "+(s>1200?"d":s>600?"w":"")})}
const TIPO={local:"Local",llevar:"Llevar",domicilio:"Domicilio"};
function card(o,btn){
  const col={pendiente:"var(--y)",confirmado:"var(--y)",preparando:"var(--b)",listo:"var(--g)"}[o.estado];
  return `<div class="card ${fresh.has(o.id)?"nuevo":""}" style="--st:${col}"><div class="h"><span class="n">#${esc(o.numero)}</span><span class="tag ${o.tipo==="domicilio"?"dom":""}">${esc(TIPO[o.tipo]||o.tipo)}</span>${o.origen==="web"?'<span class="tag web">Web</span>':""}<div class="tm">${esc(hora(o.created_at))}<span class="el" data-t="${esc(o.created_at)}"></span></div></div>
  ${o.cliente?`<div class="meta"><b>${esc(o.cliente)}</b></div>`:""}
  <ul>${(o.items||[]).map(i=>`<li><b>${esc(i.cantidad)}×</b><div>${esc(i.nombre)}${i.variante?` <small>${esc(i.variante)}</small>`:""}${i.notas?`<small>📝 ${esc(i.notas)}</small>`:""}</div></li>`).join("")}</ul>
  ${o.notas?`<div class="nota">📝 ${esc(o.notas)}</div>`:""}${btn||""}</div>`}
async function accion(fn,args){busy=true;try{await rpc(fn,args)}catch(x){alert(x.message)}busy=false;refresh()}
function referencia(id){const o=orders.find(x=>x.id===id);if(!o)return;const t=prompt("Referencia de la dirección (ej. casa azul, frente a la tienda):",o.referencia||"");if(t===null)return;accion("delivery_referencia",{p_order:id,p_ref:t})}
function dBody(o){
  const id=esc(o.id);
  const a=`<div class="meta">📍 <b>${esc(o.direccion||"Sin dirección")}</b></div><div class="meta">🧭 ${o.referencia?esc(o.referencia):"<i>Sin referencia</i>"} <a href="#" data-ref="${id}" style="color:var(--o2)">editar</a></div><div class="meta">📞 ${o.telefono?`<a style="color:var(--o2)" href="tel:${esc(o.telefono)}">${esc(o.telefono)}</a>`:"—"}</div>`;
  let rep;
  if(canDeliver)rep=o.salio_at?`<div class="meta">🛵 <b>${esc(o.repartidor||"—")}</b></div>`:`<div class="meta">🛵 <select data-rep="${id}"><option value="">Sin asignar</option>${repartidores.map(r=>`<option value="${esc(r.id)}" ${r.id===o.repartidor_id?"selected":""}>${esc(r.email)}</option>`).join("")}</select></div>`;
  else rep=`<div class="meta">🛵 ${o.mio?"<b>Asignado a ti</b>":"Sin asignar"}</div>`;
  let btn;
  if(o.estado!=="listo")btn=`<div class="vacio" style="padding:10px">En cocina: ${esc(o.estado)}</div>`;
  else if(!o.salio_at)btn=`<button class="pri" data-s="${id}">${canDeliver?"Salió a entregar":"Salir con este pedido"}</button>`;
  else btn=`<div class="meta">Salió a las <b>${esc(hora(o.salio_at))}</b></div><button class="ok" data-m="${id}|entregado">Marcar entregado</button>`;
  return a+rep+btn}
function draw(){const v=$("#v");if(!v)return;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  if(view==="cocina"){
    const cols=[["pend","Pendientes",x=>x.estado==="pendiente"||x.estado==="confirmado",o=>`<button class="pri" data-m="${esc(o.id)}|preparando">Empezar a preparar</button>`],
      ["prep","Preparando",x=>x.estado==="preparando",o=>`<button class="ok" data-m="${esc(o.id)}|listo">Marcar listo</button>`],
      ["lis","Listos",x=>x.estado==="listo",o=>`${canDeliver&&o.tipo!=="domicilio"?`<button class="ok" data-m="${esc(o.id)}|entregado">Marcar entregado</button>`:""}${o.tipo==="domicilio"?`<div class="meta">🛵 Se despacha en la pestaña Domicilios</div>`:""}<button data-m="${esc(o.id)}|preparando">Volver a preparar</button>`]];
    v.innerHTML=`<div class="board">${cols.map(([c,t,f,b])=>{const l=orders.filter(f);return`<div class="col ${c}"><h3>${t}<span>${l.length}</span></h3><div class="list">${l.map(o=>card(o,b(o))).join("")||'<div class="vacio">Sin pedidos</div>'}</div></div>`}).join("")}</div>`}
  else{
    let l=orders.filter(o=>o.tipo==="domicilio");
    if(!canDeliver)l=l.filter(o=>!o.asignado||o.mio);
    v.innerHTML=`<div class="deliv">${l.map(o=>card(o,dBody(o))).join("")||'<div class="vacio" style="grid-column:1/-1">No hay domicilios activos</div>'}</div>`}
  v.onclick=e=>{
    const r=e.target.closest("[data-ref]");if(r){e.preventDefault();referencia(r.dataset.ref);return}
    const sl=e.target.closest("[data-s]");if(sl){sl.disabled=true;accion("delivery_salir",{p_order:sl.dataset.s});return}
    const b=e.target.closest("[data-m]");if(!b)return;const i=b.dataset.m.indexOf("|");b.disabled=true;mover(b.dataset.m.slice(0,i),b.dataset.m.slice(i+1))};
  v.onchange=e=>{const s=e.target.closest("[data-rep]");if(s)accion("delivery_asignar",{p_order:s.dataset.rep,p_repartidor:s.value||null})};
  v.onfocusin=e=>{if(e.target.matches("select"))busy=true};v.onfocusout=e=>{if(e.target.matches("select"))busy=false};
  estado();tick()}
start();
</script></body></html>
