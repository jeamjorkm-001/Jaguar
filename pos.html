<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Jaguar POS</title><meta name="theme-color" content="#0b0807">
<style>
:root{--bg:#0b0807;--bg2:#120d0b;--p:#17110f;--p2:#201815;--p3:#2a201b;--t:#f7efe8;--m:#a8978a;--m2:#7a6b61;--o:#ff6b1f;--o2:#ff9a3d;--g:#35d07f;--r:#ff5c5c;--l:#2d221c;--l2:#3d2e26;--gl:linear-gradient(135deg,#ff6b1f,#ff9a3d);--sh:0 10px 30px -12px #000c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a140a55,transparent 60%),var(--bg);color:var(--t);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--l);border-radius:14px;padding:10px 14px;min-height:48px;cursor:pointer;font-weight:600;transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
button:hover{border-color:var(--l2);background:var(--p3)}button:active{transform:scale(.97)}
button.pri{background:var(--gl);color:#1b0c03;font-weight:700;border:0;box-shadow:0 8px 20px -8px #ff6b1fa0}button.pri:hover{filter:brightness(1.06)}
button.ok{background:linear-gradient(135deg,#2bc473,#47e096);color:#04210f;font-weight:700;border:0;box-shadow:0 8px 20px -8px #35d07f88}
button.ghost{background:transparent}button:disabled{opacity:.35;pointer-events:none;box-shadow:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--o);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg2);border:1px solid var(--l);border-radius:12px;padding:11px 14px;min-height:46px;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:var(--m2)}input:focus,select:focus{border-color:var(--o);box-shadow:0 0 0 3px #ff6b1f22;outline:0}
label{display:block;color:var(--m);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}
#app{height:100%}.err{color:var(--r);min-height:22px;margin:8px 0;font-size:14px}
/* marca */
.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;background:var(--gl);display:grid;place-items:center;box-shadow:0 6px 18px -6px #ff6b1faa}
.logo svg{width:20px;height:20px;fill:#1b0c03}.brand b{font-size:16px;letter-spacing:-.01em}.brand small{display:block;color:var(--m);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
/* login / caja */
.auth{min-height:100%;display:grid;place-items:center;padding:20px}
.c{width:100%;max-width:400px;background:linear-gradient(180deg,var(--p),var(--bg2));border:1px solid var(--l);border-radius:24px;padding:28px;box-shadow:var(--sh)}
.c h2{margin:18px 0 4px;font-size:22px;letter-spacing:-.02em}.c .sub{color:var(--m);margin:0 0 6px;font-size:14px}
/* layout */
.shell{display:grid;grid-template-columns:1fr 400px;height:100%;gap:0}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:10px;padding:14px 18px;align-items:center;border-bottom:1px solid var(--l);background:#0e0a09cc;backdrop-filter:blur(10px)}.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--p);border:1px solid var(--l);font-size:12.5px;color:var(--m);font-weight:600;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px #35d07f33}
.top button{min-height:40px;padding:7px 14px;border-radius:12px;font-size:14px}
.tools{display:flex;gap:12px;padding:14px 18px 4px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px}.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--m2);fill:none;stroke-width:2}
.search input{padding-left:42px;border-radius:14px;background:var(--p)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;min-height:40px;padding:6px 16px;border-radius:999px;background:var(--p);font-size:14px;color:var(--m)}
.chips .on{background:var(--gl);color:#1b0c03;border:0;box-shadow:0 6px 16px -6px #ff6b1f99}
.grid{flex:1;overflow:auto;padding:4px 18px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;align-content:start}
.it{position:relative;background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:132px;overflow:hidden;transition:transform .12s,border-color .15s,box-shadow .15s}
.it::before{content:"";position:absolute;left:0;top:0;width:100%;height:3px;background:hsl(var(--h,22) 90% 58%);opacity:.9}
.it.tap{cursor:pointer}.it.tap:hover{border-color:var(--l2);transform:translateY(-2px);box-shadow:var(--sh)}.it.tap:active{transform:scale(.97)}
.it .cl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:hsl(var(--h,22) 80% 68%);font-weight:700}
.it h4{margin:0;font-size:15.5px;font-weight:650;line-height:1.25;letter-spacing:-.01em;flex:1}
.it .pr{display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:750}
.it .plus{width:34px;height:34px;border-radius:11px;background:var(--gl);display:grid;place-items:center;color:#1b0c03;font-size:20px;font-weight:800;line-height:1}
.it .vs{display:flex;flex-direction:column;gap:6px}.it .vs button{display:flex;justify-content:space-between;min-height:40px;padding:8px 12px;border-radius:11px;font-size:13.5px}.it .vs button b{color:var(--o2)}
.it .xb{min-height:34px;padding:6px 10px;border-radius:10px;font-size:12.5px;align-self:flex-start}.it.ag{opacity:.45}.it .tag{align-self:flex-start;background:#ff5c5c22;color:var(--r);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px}
.empty{grid-column:1/-1;text-align:center;color:var(--m);padding:40px 0}
/* carrito */
.cart{display:flex;flex-direction:column;background:linear-gradient(180deg,var(--p),var(--bg2));min-height:0;border-left:1px solid var(--l)}
.cart .hd{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between}.cart .hd h3{margin:0;font-size:17px;letter-spacing:-.01em}.cart .hd span{color:var(--m);font-size:13px}
.cart .body{flex:1;overflow:auto;padding:0 18px 10px}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--l);border-radius:14px;padding:4px}.seg button{flex:1;min-height:40px;border:0;background:transparent;border-radius:10px;font-size:13.5px;color:var(--m)}
.seg .on{background:var(--p3);color:var(--t);box-shadow:0 2px 8px #0008,inset 0 0 0 1px var(--l2)}
#dom input{margin-top:8px}
.ln{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.ln .nm{flex:1;min-width:0;font-size:14px;line-height:1.3}.ln .nm small{color:var(--m)}
.ln .tt{font-weight:700;min-width:70px;text-align:right}
.stp{display:flex;align-items:center;gap:2px;background:var(--bg);border:1px solid var(--l);border-radius:12px}.stp button{min-height:34px;width:34px;padding:0;border:0;background:transparent;font-size:18px;border-radius:10px}.stp b{min-width:22px;text-align:center}
.emp{color:var(--m);text-align:center;padding:36px 10px;border:1px dashed var(--l2);border-radius:16px;margin-top:14px}
.tot{padding:14px 18px 18px;border-top:1px solid var(--l);background:#0c0807}.tot>div{display:flex;justify-content:space-between;align-items:center;margin:5px 0;color:var(--m);font-size:14px}
.tot .big{font-size:26px;font-weight:800;color:var(--t);letter-spacing:-.02em;margin:10px 0 12px}.tot input{min-height:38px;padding:6px 10px}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}.row .s{flex:0 0 52px}
/* modal */
.md{position:fixed;inset:0;background:#000b;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5;animation:fi .15s}
.md>div{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l2);border-radius:22px;padding:22px;width:100%;max-width:480px;max-height:94vh;overflow:auto;box-shadow:0 30px 80px -20px #000;animation:up .2s}
.md h3{margin:0 0 12px;font-size:20px;letter-spacing:-.02em}.md h4{margin:18px 0 8px;font-size:12px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}
.md select,.md button[data-all]{text-transform:capitalize}
.sum{background:var(--bg);border:1px solid var(--l);border-radius:14px;padding:4px 14px;margin:8px 0}.sum div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--l);font-size:14px}.sum div:last-child{border:0}
.bdg:not(:empty){display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--o);color:#1b0c03;font-size:12px;line-height:20px;text-align:center}.pw{border:1px solid var(--l);border-radius:14px;padding:12px;margin:10px 0;background:var(--bg)}.pw h4{margin:0 0 4px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--t)}.pw small{color:var(--m)}.pw ul{margin:8px 0;padding-left:18px;font-size:13.5px}@keyframes fi{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(14px) scale(.98)}}
#rcpt{display:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--l2);border-radius:8px}
@media(max-width:1000px){.shell{grid-template-columns:1fr 340px}}
@media(max-width:820px){.shell{grid-template-columns:1fr;grid-template-rows:1fr 48%}.cart{border-left:0;border-top:1px solid var(--l2);border-radius:22px 22px 0 0;box-shadow:0 -14px 40px -16px #000}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.top .pill.hm{display:none}.brand small{display:none}.brand b{white-space:nowrap}.top{padding:10px 12px}}
@media print{body>*:not(#rcpt){display:none!important}body{background:#fff}#rcpt{display:block;color:#000;background:#fff;font:13px monospace;width:72mm}#rcpt hr{border:0;border-top:1px dashed #000}#rcpt .r{display:flex;justify-content:space-between}}
</style></head><body>
<div id="app"></div><div id="md"></div><div id="rcpt"></div>
<script>
const SUPA={url:"https://akaecdfbpsqhqkgafjta.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYWVjZGZicHNxaHFrZ2FmanRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMzQyMTIsImV4cCI6MjEwNzYxMDIxMn0.gTohBD9OgC3rji_MX6lftWetvjuVQ6zCizbR1p_c5Oc"};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cop=n=>"$"+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
const LOGO='<span class="logo"><svg viewBox="0 0 24 24"><path d="M4 3l4 3h8l4-3 1 7c0 6-3.5 11-9 11S3 16 3 10l1-7zm5 9a1.3 1.3 0 100 2.6A1.3 1.3 0 009 12zm6 0a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zm-4.2 4l1.2 1.2 1.2-1.2z"/></svg></span>';
const NOMBRE="Jaguar Burger & Grill";
let ses=null,MENU=[],DOM=5000,cat="",q="",cart=[],tipo="local",caja=null,admin=false,cli=null,cliRes=[],cliT=null;
try{ses=JSON.parse(sessionStorage.getItem("pos-ses")||"null")}catch(_){}
/* ---------- red ---------- */
async function api(path,opt,tok){
  let r;try{r=await fetch(SUPA.url+path,Object.assign({},opt,{headers:Object.assign({apikey:SUPA.key,Authorization:"Bearer "+(tok||SUPA.key),"Content-Type":"application/json"},(opt||{}).headers)}))}
  catch(_){throw new Error("No se pudo conectar. Revisa tu internet y abre esta página desde su enlace en el navegador (Chrome), no desde la vista previa de Claude.")}
  let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description))||"Error "+r.status);return j}
function setSes(j,email){ses=j?{at:j.access_token,rt:j.refresh_token,exp:Date.now()/1000+(j.expires_in||3600),email:email||(ses&&ses.email)}:null;sessionStorage.setItem("pos-ses",JSON.stringify(ses))}
async function token(){if(!ses)return null;if(ses.exp-Date.now()/1000>60)return ses.at;
  try{setSes(await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:ses.rt})}));return ses.at}catch(_){setSes(null);return null}}
const rpc=async(n,a)=>api("/rest/v1/rpc/"+n,{method:"POST",body:JSON.stringify(a||{})},await token());
const get=async p=>api("/rest/v1/"+p,{},await token());
/* ---------- menú (base + cambios del panel) ---------- */
async function cargarMenu(){
  try{const c=(await api("/rest/v1/site_config?id=eq.1&select=config"))[0].config||{};DOM=Number.isInteger((c.negocio||{}).domicilio)?c.negocio.domicilio:5000}catch(_){}
  const m=await rpc("menu_publico");
  if(!m||!Array.isArray(m.categorias)||!m.categorias.length)throw new Error("No se pudo cargar el menú.");
  MENU=m.categorias.map(c=>({id:c.id,n:c.nombre||c.id,items:(c.items||[]).map(i=>({k:i.id,id:i.id,
    n:(!c.pre||/perro/i.test(i.n))?i.n:c.pre+" "+i.n,p:(i.v&&i.v.length)?null:i.p,
    v:(i.v&&i.v.length)?i.v.map(x=>[x.n,x.p]):null,g:(i.g||[]).filter(g=>(g.m||[]).length),ag:i.ag===true}))})).filter(c=>c.items.length);
  if(Array.isArray(m.combos)&&m.combos.length)MENU.unshift({id:"combos",n:"Combos",items:m.combos.map(c=>({k:"combo|"+c.id,id:c.id,combo:true,
    n:c.n,p:c.p,v:null,g:[],ag:c.ag===true,
    d:[c.d,(c.items||[]).map(x=>x.cantidad+"x "+x.n+(x.variante?" ("+x.variante+")":"")).join(" + ")].filter(Boolean).join(" · ")}))});
  cat=MENU[0].id}
/* ---------- arranque ---------- */
function login(msg){$("#app").innerHTML=`<div class="auth"><div class="c"><div class="brand">${LOGO}<div><b>Jaguar POS</b><small>Burger &amp; Grill</small></div></div><h2>Bienvenido</h2><p class="sub">Inicia sesión para abrir el mostrador.</p><label>Correo</label><input id="em" type="email" autocomplete="username" placeholder="tu@correo.com"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"><div class="err" id="er">${esc(msg||"")}</div><button class="pri" style="width:100%" id="go">Entrar</button></div></div>`;
  const go=async()=>{try{const e=$("#em").value.trim();setSes(await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:e,password:$("#pw").value})}),e);start()}catch(x){$("#er").textContent=/invalid/i.test(x.message)?"Correo o contraseña incorrectos.":x.message}};
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()}}
async function start(){
  if(!ses)return login();
  $("#app").innerHTML='<div class="auth"><div class="c" style="text-align:center"><div class="brand" style="justify-content:center">'+LOGO+'<b>Cargando…</b></div></div></div>';
  try{admin=(await get("admin_users?select=user_id")).length>0;const rl=(await get("user_roles?select=role")).map(x=>x.role);
    if(!admin&&!rl.includes("cajero")){await salir("Esta cuenta no tiene permiso de cajero.");return}
    await cargarMenu();caja=await rpc("cash_summary");shell()}catch(x){await salir(x.message)}}
async function salir(m){try{if(ses)await api("/auth/v1/logout",{method:"POST"},ses.at)}catch(_){}setSes(null);cart=[];login(m)}
/* ---------- pantalla principal ---------- */
const ICO_S='<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
function shell(){
  if(!caja)return abrirCajaUI();
  const ab=new Date(caja.abierta).toLocaleTimeString("es-CO",{timeZone:"America/Bogota",hour:"2-digit",minute:"2-digit"});
  $("#app").innerHTML=`<div class="shell"><div class="main"><div class="top"><div class="brand">${LOGO}<div><b>Jaguar POS</b><small>Burger &amp; Grill</small></div></div><span class="sp"></span><span class="pill hm"><i></i>Caja abierta · ${esc(ab)}</span><span class="pill" id="clk"></span><button id="bped" type="button">Pedidos <b id="bpn" class="bdg"></b></button><a href="cocina.html" style="text-decoration:none"><button type="button">Cocina</button></a><button id="bmenu" class="ghost">Menú</button><button id="bcaja">Caja</button><button class="ghost" id="bsal">Salir</button></div>
  <div class="tools"><div class="search">${ICO_S}<input id="bq" placeholder="Buscar producto…" type="search"></div></div>
  <div class="chips" id="chips"></div><div class="grid" id="grid"></div></div>
  <div class="cart"><div class="hd"><h3>Pedido actual</h3><span id="cnt"></span></div><div class="body"><div class="seg" id="tipos"></div><div id="dom"></div><div id="lines"></div></div><div class="tot" id="tot"></div></div></div>`;
  $("#bped").onclick=pedidosUI;$("#bmenu").onclick=()=>{if(cart.length&&!confirm("Hay un pedido sin cobrar. ¿Salir al menú y perderlo?"))return;location.href="admin.html"};$("#bcaja").onclick=cajaUI;$("#bsal").onclick=()=>salir();$("#bq").oninput=e=>{q=e.target.value.trim().toLowerCase();drawMenu()};
  const tick=()=>{const c=$("#clk");if(c)c.textContent=new Date().toLocaleTimeString("es-CO",{timeZone:"America/Bogota",hour:"2-digit",minute:"2-digit"});else clearInterval(tk)};tick();const tk=setInterval(tick,15000);
  drawMenu();drawCart();pollPedidos()}
function drawMenu(){
  $("#chips").innerHTML=MENU.map(c=>`<button data-c="${c.id}" class="${!q&&c.id===cat?"on":""}">${esc(c.n)}</button>`).join("");
  $("#chips").onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;$("#bq").value="";q="";drawMenu()}};
  const its=MENU.flatMap((c,ci)=>(q||c.id===cat)?c.items.map(i=>({...i,cn:c.n,h:(ci*47+12)%360})):[]).filter(i=>!q||i.n.toLowerCase().includes(q));
  $("#grid").innerHTML=its.map(i=>{const head=`<span class="cl">${esc(i.cn)}</span><h4>${esc(i.n)}</h4>${i.combo&&i.d?`<small style="display:block;opacity:.7;font-size:11px;line-height:1.3">${esc(i.d)}</small>`:""}`;
    if(i.ag)return`<div class="it ag" style="--h:${i.h}">${head}<span class="tag">Agotado</span></div>`;
    const ex=i.g&&i.g.length?`<button class="xb" data-x="${esc(i.k)}">+ Extras</button>`:"";
    if(i.v)return`<div class="it" style="--h:${i.h}">${head}<div class="vs">${i.v.map((v,y)=>`<button data-a="${esc(i.k)}|${y}"><span>${esc(v[0])}</span><b>${cop(v[1])}</b></button>`).join("")}${ex}</div></div>`;
    return`<div class="it tap" style="--h:${i.h}" data-a="${esc(i.k)}|-1">${head}<div class="pr"><span>${cop(i.p)}</span><span class="plus">+</span></div>${ex}</div>`}).join("")||'<div class="empty">Sin resultados.</div>';
  $("#grid").onclick=e=>{const x=e.target.closest("[data-x]");if(x){e.stopPropagation();extras(x.dataset.x);return}const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=a.lastIndexOf("|");add(a.slice(0,i),+a.slice(i+1))}}
function pushLine(it,v,mods,notas){
  const base=v?v[1]:it.p,p=base+mods.reduce((t,m)=>t+m.p,0),key=(it.combo?"c:":"")+it.id+"|"+(v?v[0]:"")+"|"+mods.map(m=>m.id).sort().join(",")+"|"+(notas||""),l=cart.find(x=>x.key===key);
  if(l){if(l.q<99)l.q++}else cart.push({key,id:it.id,n:it.n,v:v?v[0]:"",p,q:1,mods,notas:notas||"",combo:!!it.combo,d:it.combo?it.d:""});drawCart()}
function add(k,y){const it=MENU.flatMap(c=>c.items).find(i=>i.k===k);if(!it||it.ag)return;
  if((it.g||[]).some(g=>g.min>0)){extras(k,y);return}
  pushLine(it,y>=0?it.v[y]:null,[],"")}
function extras(k,y0){const it=MENU.flatMap(c=>c.items).find(i=>i.k===k);if(!it||it.ag)return;

    const b=$("#wno");b.disabled=true;try{await rpc("order_cancelar",{p_order:o.id,p_motivo:m});await pedidosUI()}catch(e){b.disabled=false;$("#pe").textContent=e.message}}}

function abrirCajaUI(){$("#app").innerHTML=`<div class="auth"><div class="c"><div class="brand">${LOGO}<div><b>Jaguar POS</b><small>Burger &amp; Grill</small></div></div><h2>Abrir caja</h2><p class="sub">Cuenta el efectivo con el que empieza el turno.</p><label>Efectivo inicial</label><input id="ini" inputmode="numeric" placeholder="0"><div class="err" id="er"></div><button class="pri" style="width:100%" id="ab">Abrir caja</button><button class="ghost" style="width:100%;margin-top:10px" id="so">Salir</button></div></div>`;
  $("#so").onclick=()=>salir();$("#ab").onclick=async()=>{try{await rpc("open_cash",{p_opening:Math.round(+$("#ini").value.replace(/\D/g,""))||0});caja=await rpc("cash_summary");shell()}catch(e){$("#er").textContent=e.message}}}
function cajaUI(){const c=caja,v=c.ventas||{},tv=Object.values(v).reduce((a,b)=>a+b,0);
  modal(`<h3>Caja</h3><div class="sum"><div><span>Abierta</span><span>${new Date(c.abierta).toLocaleString("es-CO",{timeZone:"America/Bogota"})}</span></div><div><span>Efectivo inicial</span><span>${cop(c.inicial)}</span></div>
  ${["efectivo","tarjeta","transferencia"].map(m=>`<div><span>Ventas ${m}</span><span>${cop(v[m]||0)}</span></div>`).join("")}<div><span>Ventas totales</span><b>${cop(tv)}</b></div>
  <div><span>Entradas</span><span>${cop(c.entradas)}</span></div><div><span>Retiros</span><span>-${cop(c.retiros)}</span></div><div><span>Gastos</span><span>-${cop(c.gastos)}</span></div><div><span>Devoluciones</span><span>-${cop(c.devoluciones)}</span></div><div><b>Efectivo esperado</b><b>${cop(c.esperado)}</b></div></div>
  <h4>Registrar movimiento</h4><div class="row"><select id="mk"><option value="entrada">Entrada</option><option value="retiro">Retiro</option><option value="gasto">Gasto</option><option value="devolucion">Devolución</option></select><input id="ma" inputmode="numeric" placeholder="Monto"></div><input id="mn" placeholder="Nota (opcional)"><button style="width:100%;margin-top:8px" id="mg">Guardar movimiento</button>
  <h4>Cerrar caja</h4><input id="cc" inputmode="numeric" placeholder="Efectivo contado"><div class="err" id="pe"></div><div class="row"><button id="cx2">Volver</button><button class="pri" id="cr">Cerrar caja</button></div>`);
  $("#cx2").onclick=cerrarModal;
  $("#mg").onclick=async()=>{try{await rpc("cash_move",{p_kind:$("#mk").value,p_amount:Math.round(+$("#ma").value.replace(/\D/g,""))||0,p_note:$("#mn").value});caja=await rpc("cash_summary");cajaUI()}catch(e){$("#pe").textContent=e.message}};
  $("#cr").onclick=async()=>{const n=$("#cc").value.replace(/\D/g,"");if(n===""){$("#pe").textContent="Escribe el efectivo contado.";return}
    if(!confirm("¿Cerrar la caja? Ya no podrás vender hasta abrir otra."))return;
    try{const r=await rpc("close_cash",{p_counted:+n});caja=null;const df=r.diferencia;
      modal(`<h3>Caja cerrada</h3><div class="sum"><div><span>Esperado</span><span>${cop(r.esperado)}</span></div><div><span>Contado</span><span>${cop(r.contado)}</span></div><div><b>Diferencia</b><b style="color:${df?"var(--r)":"var(--g)"}">${df>0?"+":""}${cop(df)}</b></div></div><button class="pri" style="width:100%;margin-top:12px" id="fin">Listo</button>`);
      $("#fin").onclick=()=>{cerrarModal();shell()}}catch(e){$("#pe").textContent=e.message}}}
function modal(h){$("#md").onclick=null;$("#md").innerHTML=`<div class="md"><div>${h}</div></div>`}
function cerrarModal(){$("#md").innerHTML=""}
start();
</script></body></html>
