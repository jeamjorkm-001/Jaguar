<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#0b0807">
<title>Jaguar · Menú</title>
<style>
:root{--bg:#0b0807;--bg2:#120d0b;--p:#17110f;--p2:#201815;--p3:#2a201b;--t:#f7efe8;--m:#a8978a;--m2:#7a6b61;--o:#ff6b1f;--o2:#ff9a3d;--r:#ff5c5c;--l:#2d221c;--l2:#3d2e26;--gl:linear-gradient(135deg,#ff6b1f,#ff9a3d)}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{background:radial-gradient(1200px 600px at 10% -10%,#2a140a55,transparent 60%),var(--bg);color:var(--t);font:15px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:var(--p2);border:1px solid var(--l);border-radius:14px;padding:10px 14px;min-height:48px;cursor:pointer;font-weight:600}
button:hover{border-color:var(--l2);background:var(--p3)}button.pri{background:var(--gl);color:#1b0c03;font-weight:700;border:0}button.ghost{background:transparent}
input{width:100%;background:var(--bg2);border:1px solid var(--l);border-radius:12px;padding:11px 14px;min-height:46px}input:focus{border-color:var(--o);outline:0;box-shadow:0 0 0 3px #ff6b1f22}
label{display:block;color:var(--m);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}
.err{color:var(--r);min-height:22px;margin:8px 0;font-size:14px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:11px;background:var(--gl);display:grid;place-items:center}.logo svg{width:20px;height:20px;fill:#1b0c03}
.brand b{font-size:16px}.brand small{display:block;color:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}
.c{width:100%;max-width:400px;background:linear-gradient(180deg,var(--p),var(--bg2));border:1px solid var(--l);border-radius:24px;padding:28px}.c h2{margin:18px 0 4px;font-size:22px}.c .sub{color:var(--m);margin:0}
.top{display:flex;gap:10px;padding:12px 18px;align-items:center;border-bottom:1px solid var(--l);background:#0e0a09cc}.top .sp{flex:1}.top small{color:var(--m);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.top button{min-height:40px;padding:6px 14px;border-radius:12px;font-size:14px}
.wrap{max-width:900px;margin:0 auto;padding:18px}
h3{margin:22px 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
a.t{display:block;text-decoration:none;color:inherit;background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid var(--l);border-radius:18px;padding:18px;transition:border-color .15s,transform .12s}
a.t:hover{border-color:var(--o)}a.t:active{transform:scale(.98)}
a.t .e{font-size:26px}a.t b{display:block;font-size:17px;margin:6px 0 2px}a.t span{color:var(--m);font-size:13px}
div.t{background:var(--p);border:1px dashed var(--l);border-radius:18px;padding:18px;opacity:.6}div.t .e{font-size:26px}div.t b{display:block;font-size:16px;margin:6px 0 2px}div.t span{color:var(--m);font-size:13px}
</style></head><body>
<div id="app"></div>
<script>
const SUPA={url:"https://akaecdfbpsqhqkgafjta.supabase.co",key:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrYWVjZGZicHNxaHFrZ2FmanRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMzQyMTIsImV4cCI6MjEwNzYxMDIxMn0.gTohBD9OgC3rji_MX6lftWetvjuVQ6zCizbR1p_c5Oc"};
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LOGO='<span class="logo"><svg viewBox="0 0 24 24"><path d="M4 3l4 3h8l4-3 1 7c0 6-3.5 11-9 11S3 16 3 10l1-7zm5 9a1.3 1.3 0 100 2.6A1.3 1.3 0 009 12zm6 0a1.3 1.3 0 100 2.6 1.3 1.3 0 000-2.6zm-4.2 4l1.2 1.2 1.2-1.2z"/></svg></span>';
/* Las pantallas guardan su sesión con estas llaves; así entras una sola vez desde este menú (misma pestaña). */
const KEYS=["adm-ses","pos-ses","kds-ses","inv-ses"];
let ses=null;try{ses=JSON.parse(sessionStorage.getItem("adm-ses")||"null")}catch(_){}
async function api(path,opt,tok){
  let r;try{r=await fetch(SUPA.url+path,Object.assign({},opt,{headers:Object.assign({apikey:SUPA.key,Authorization:"Bearer "+(tok||SUPA.key),"Content-Type":"application/json"},(opt||{}).headers)}))}
  catch(_){throw new Error("No se pudo conectar. Revisa tu internet.")}
  let j=null;try{j=await r.json()}catch(_){}
  if(!r.ok)throw new Error((j&&(j.message||j.msg||j.error_description))||"Error "+r.status);return j}
function setSes(j,email){ses=j?{at:j.access_token,rt:j.refresh_token,exp:Date.now()/1000+(j.expires_in||3600),email:email||(ses&&ses.email)}:null;
  KEYS.forEach(k=>{try{ses?sessionStorage.setItem(k,JSON.stringify(ses)):sessionStorage.removeItem(k)}catch(_){}})}
async function token(){if(!ses)return null;if(ses.exp-Date.now()/1000>60)return ses.at;
  try{setSes(await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:ses.rt})}));return ses.at}catch(_){setSes(null);return null}}
const get=async p=>{const t=await token();if(!t)throw new Error("Tu sesión venció. Entra de nuevo.");return api("/rest/v1/"+p,{},t)};
function login(msg){$("#app").innerHTML=`<div class="auth"><div class="c"><div class="brand">${LOGO}<div><b>Jaguar</b><small>Burger &amp; Grill</small></div></div><h2>Entrar</h2><p class="sub">Un solo inicio de sesión para tus pantallas.</p><label>Correo</label><input id="em" type="email" autocomplete="username"><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="er">${esc(msg||"")}</div><button class="pri" style="width:100%" id="go">Entrar</button></div></div>`;
  const go=async()=>{try{const e=$("#em").value.trim();setSes(await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:e,password:$("#pw").value})}),e);start()}catch(x){$("#er").textContent=/invalid/i.test(x.message)?"Correo o contraseña incorrectos.":x.message}};
  $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()}}
async function salir(m){try{if(ses)await api("/auth/v1/logout",{method:"POST"},ses.at)}catch(_){}setSes(null);login(m)}
/* Cada pantalla valida el permiso en el servidor; esto solo decide qué botones mostrar. */
const TILES=[
  {h:"pos.html",e:"🧾",t:"Punto de venta",d:"Vender, cobrar, clientes y caja",r:["admin","cajero"]},
  {h:"cocina.html",e:"👨‍🍳",t:"Cocina y domicilios",d:"Pedidos, estados, repartidores y entregas",r:["admin","cajero","cocina","repartidor"]},
  {h:"index.html?admin",e:"🍔",t:"Productos y precios",d:"Editar el menú de la tienda",r:["admin"]},
  {h:"index.html",e:"🛒",t:"Tienda en línea",d:"Lo que ven tus clientes",r:["admin","cajero","cocina","repartidor"]}];
const SOON=[["📦","Inventario","Stock, compras, mermas y alertas"],["📊","Reportes","Ventas, ticket promedio, horas pico y utilidad"],["👥","Usuarios y auditoría","Roles, permisos y registro de cambios"]];
async function start(){
  if(!ses)return login();
  $("#app").innerHTML='<div class="auth"><div class="c" style="text-align:center"><b>Cargando…</b></div></div>';
  try{const adm=(await get("admin_users?select=user_id")).length>0,rl=(await get("user_roles?select=role")).map(x=>x.role);
    const mine=new Set(adm?["admin","cajero","cocina","repartidor"]:rl),vis=TILES.filter(t=>t.r.some(x=>mine.has(x)));
    if(!adm&&!rl.length){await salir("Esta cuenta no tiene ningún rol asignado.");return}
    $("#app").innerHTML=`<div class="top"><div class="brand">${LOGO}<div><b>Jaguar</b></div></div><span class="sp"></span><small>${esc(ses.email||"")}</small><button class="ghost" id="bs">Salir</button></div>
    <div class="wrap"><h3>Tus pantallas · ${esc(adm?"administrador":rl.join(", "))}</h3><div class="grid">${vis.map(t=>`<a class="t" href="${esc(t.h)}"><span class="e">${t.e}</span><b>${esc(t.t)}</b><span>${esc(t.d)}</span></a>`).join("")}</div>
    ${adm?`<h3>Próximamente</h3><div class="grid">${SOON.map(s=>`<div class="t"><span class="e">${s[0]}</span><b>${esc(s[1])}</b><span>${esc(s[2])}</span></div>`).join("")}</div>`:""}</div>`;
    $("#bs").onclick=()=>salir()}catch(x){await salir(x.message)}}
start();
</script></body></html>
